<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TRẠM ĐĂNG BÀI • PHÚC HỌC ĐIỀU HAY</title>
  <link rel="icon" type="image/png" href="Avatar.png">
  <link rel="apple-touch-icon" href="Avatar.png">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-inner: #0d1322;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.06); }

    /* HEADER */
    header { background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, rgba(17, 24, 39, 0) 100%); padding: 14px 16px 10px 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .brand-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .header-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.2px; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* 2 TAB SWITCHER */
    .tab-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #090d16; margin: 10px 14px 4px 14px; border-radius: 14px; padding: 4px; border: 1px solid var(--border); gap: 6px; }
    .tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 11px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
    .tab-btn.tab-img.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }

    /* STATS & PROGRESS */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 2px 16px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); width: 0%; transition: width 0.3s; }

    /* ACTIVE CARD */
    .current-card { margin: 10px 14px 12px 14px; background: var(--card-inner); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    
    /* CARD HEADER */
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stt-group { display: flex; align-items: center; gap: 8px; }
    .badge-stt { font-size: 12px; font-weight: 900; background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 3px 9px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.35); font-family: 'JetBrains Mono', monospace; }
    .badge-category { font-size: 11px; font-weight: 700; color: var(--text-muted); max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .nav-buttons { display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: #162035; border: 1px solid var(--border); color: #cbd5e1; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .btn-nav:hover { background: #223150; color: #fff; }
    .btn-nav:active { transform: scale(0.95); }

    .current-title { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.45; }

    /* 5-ROW ACTION BUTTONS GRID */
    .actions-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .btn-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-act { height: 42px; border: none; border-radius: 12px; padding: 0 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; user-select: none; }
    .btn-act:active { transform: scale(0.97); }

    /* ROW 1: XEM DRIVE & TẢI DRIVE */
    .btn-view-drive { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; }
    .btn-view-drive:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-download-drive { background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-download-drive:hover { background: rgba(16, 185, 129, 0.28); }

    /* ROW 2: CAPTION FB & BÌNH LUẬN */
    .btn-copy-fb { background: rgba(24, 119, 242, 0.18); border: 1px solid rgba(24, 119, 242, 0.45); color: #60a5fa; }
    .btn-copy-fb:hover { background: rgba(24, 119, 242, 0.28); }
    .btn-copy-pinned { background: rgba(168, 85, 247, 0.18); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; }
    .btn-copy-pinned:hover { background: rgba(168, 85, 247, 0.28); }

    /* ROW 3: CAPTION TIKTOK & CAPTION ZALO */
    .btn-copy-tiktok { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); color: #fb7185; }
    .btn-copy-tiktok:hover { background: rgba(244, 63, 94, 0.25); }
    .btn-copy-zalo { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.35); color: #38bdf8; }
    .btn-copy-zalo:hover { background: rgba(14, 165, 233, 0.25); }

    /* ROW 4: YOUTUBE TIÊU ĐỀ & MÔ TẢ (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) */
    .btn-copy-yt-title { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; }
    .btn-copy-yt-title:hover { background: rgba(245, 158, 11, 0.25); }
    .btn-copy-yt-desc { background: rgba(203, 213, 225, 0.1); border: 1px solid var(--border); color: #cbd5e1; }
    .btn-copy-yt-desc:hover { background: rgba(203, 213, 225, 0.18); }

    /* ROW 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - FULL WIDTH, NỔI BẬT */
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; font-weight: 900; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none; }
    .btn-mark-posted.state-pending { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35); }
    .btn-mark-posted.state-pending:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .btn-mark-posted.state-done { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45); color: #34d399; }
    .btn-mark-posted.state-done:hover { background: rgba(16, 185, 129, 0.3); }

    /* PREVIEW FRAME (DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU CHO CẢ VIDEO & ẢNH) */
    .preview-section { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .preview-header-label { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); font-weight: 700; padding: 0 2px; }
    .preview-box { width: 100%; height: 260px; background: #050811; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .preview-box iframe { width: 100%; height: 100%; border: none; border-radius: 14px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); padding: 16px; text-align: center; }
    .preview-placeholder .icon { font-size: 38px; }
    .preview-placeholder .hint { font-size: 11.5px; color: #64748b; }

    /* LIST & SEARCH SECTION (DƯỚI CÙNG) */
    .list-section { padding: 12px 14px 16px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: rgba(11, 17, 32, 0.5); }
    .search-input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }

    .filter-chips { display: flex; gap: 6px; overflow-x: auto; }
    .filter-chip { background: #090d16; border: 1px solid var(--border); color: var(--text-muted); font-size: 11.5px; font-weight: 800; padding: 6px 12px; border-radius: 18px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .filter-chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .filter-chip.chip-pending.active { background: #ef4444; color: #fff; border-color: #ef4444; }
    .filter-chip.chip-done.active { background: #10b981; color: #000; border-color: #10b981; }

    .table-container { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; background: #090d16; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #131d31; padding: 8px 10px; text-align: left; color: var(--text-muted); font-size: 11px; font-weight: 800; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.04); }
    tr.active { background: rgba(245, 158, 11, 0.15); font-weight: 700; }
    .badge-status { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .badge-status.pending { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-status.done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; font-weight: 900; font-size: 13px; padding: 10px 22px; border-radius: 20px; z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 12px; object-fit: contain; }
      .btn-copy-aff { background: rgba(234, 179, 8, 0.16); border: 1px solid rgba(234, 179, 8, 0.42); color: #fde047; }
    .btn-copy-aff:hover { background: rgba(234, 179, 8, 0.27); }
    .btn-link-aff { background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.42); color: #34d399; }
    .btn-link-aff:hover { background: rgba(16, 185, 129, 0.27); }
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrap">
        <img src="Avatar.png" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23f59e0b\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>PH</text></svg>'">
        <div>
          <h1 class="header-title">PHÚC HỌC ĐIỀU HAY</h1>
          <div class="header-subtitle">Trạm Đăng Bài Mobile • Cả Video & Ảnh Dạy Con</div>
        </div>
      </div>
    </header>

    <!-- SWITCH 2 TAB CHÍNH -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabVideoBtn" onclick="switchTab('video')">🎬 ĐĂNG VIDEO (<span id="vCount">0</span>)</button>
      <button class="tab-btn tab-img" id="tabImageBtn" onclick="switchTab('image')">📸 ĐĂNG ẢNH (<span id="iCount">0</span>)</button>
    </div>

    <!-- STATS & PROGRESS BAR -->
    <div class="stats-bar">
      <span id="statText">Đang tải...</span>
      <span id="statPercent">0%</span>
    </div>
    <div style="padding: 0 14px;"><div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div></div>

    <!-- ACTIVE CARD -->
    <div class="current-card">
      <div class="card-top">
        <div class="stt-group">
          <span class="badge-stt" id="currStt">#---</span>
          <span class="badge-category" id="currCategory">Phúc Học Điều Hay</span>
        </div>
        <div class="nav-buttons">
          <button class="btn-nav" onclick="prevItem()" title="Bài trước">⬅️ Trước</button>
          <button class="btn-nav" onclick="nextItem()" title="Bài tiếp theo">Sau ➡️</button>
        </div>
      </div>

      <div class="current-title" id="currTitle">Đang nạp bài viết...</div>

      <!-- 5 HÀNG NÚT BẤM CÂN XỨNG -->
      <div class="actions-grid">
        <!-- HÀNG 1: XEM DRIVE (TRÊN KHUNG XEM) & TẢI VỀ MÁY -->
        <div class="btn-row-2col">
          <button class="btn-act btn-view-drive" id="btnViewDrive" onclick="triggerViewInFrame()">
            <span>👁️ Xem Drive</span>
          </button>
          <button class="btn-act btn-download-drive" id="btnDownloadDrive" onclick="triggerDownloadDrive()">
            <span id="lblDownloadDrive">📥 Tải Drive</span>
          </button>
        </div>

        <!-- HÀNG 2: CAPTION FACEBOOK & BÌNH LUẬN -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-fb" onclick="copyCurrentField('facebook', 'Caption Facebook')">
            <span>📘 Caption Facebook</span>
          </button>
          <button class="btn-act btn-copy-pinned" onclick="copyCurrentField('pinnedComment', 'Bình Luận')">
            <span>📌 Bình Luận</span>
          </button>
        </div>

        <!-- HÀNG 3: CAPTION TIKTOK & CAPTION ZALO -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-tiktok" onclick="copyCurrentField('tiktok', 'Caption TikTok')">
            <span>🎵 Caption TikTok</span>
          </button>
          <button class="btn-act btn-copy-zalo" onclick="copyCurrentField('zalo', 'Caption Zalo')">
            <span>💬 Caption Zalo</span>
          </button>
        </div>

        <!-- HÀNG 4: CAPTION YOUTUBE & MÔ TẢ YOUTUBE (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-yt-title" id="btnRow4Col1" onclick="copyRow4Col1()">
            <span id="lblRow4Col1">▶️ Caption YouTube</span>
          </button>
          <button class="btn-act btn-copy-yt-desc" id="btnRow4Col2" onclick="copyRow4Col2()">
            <span id="lblRow4Col2">📄 Mô Tả YouTube</span>
          </button>
        </div>

        <!-- HÀNG 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - DÀI, MÀU ĐỎ NỔI BẬT -->
        <div class="btn-row-2col">
  <button class="btn-act btn-link-aff" id="btnCopyAffiliateLink" onclick="copyAffiliateLink()">
    <span>🔗 Link AFF</span>
  </button>
  <button class="btn-act btn-copy-aff" id="btnCopyAffiliate" onclick="copyAffiliateSuggestions()">
    <span>🛒 Gợi ý AFF</span>
  </button>
</div>
<button class="btn-mark-posted state-pending" id="btnMarkPosted" onclick="toggleCurrentDone()">
  <span id="lblMarkPosted">🔴 ĐÃ ĐĂNG BÀI</span>
</button>
      </div>

      <!-- KHUNG XEM TRỰC TIẾP VIDEO & ẢNH (ĐẶT DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU) -->
      <div class="preview-section">
        <div class="preview-header-label">
          <span id="previewTypeLabel">Khung Xem Trực Tiếp:</span>
          <span id="previewActionHint" style="font-size:11px;color:#38bdf8;cursor:pointer;" onclick="openDriveExternalTab()">Mở tab Drive ↗</span>
        </div>
        <div class="preview-box" id="previewMediaBox">
          <!-- Video Iframe hoặc Thẻ Img sẽ được render tại đây -->
        </div>
      </div>
    </div>

    <!-- LIST & SEARCH SECTION (DƯỚI CÙNG - MẶC ĐỊNH LỌC CHƯA ĐĂNG) -->
    <div class="list-section">
      <div class="filter-chips">
        <button class="filter-chip chip-pending active" id="chipPending" onclick="setFilter('pending')">⏳ Chưa đăng (<span id="countPending">0</span>)</button>
        <button class="filter-chip chip-done" id="chipDone" onclick="setFilter('done')">✅ Đã đăng (<span id="countDone">0</span>)</button>
        <button class="filter-chip" id="chipAll" onclick="setFilter('all')">Tất cả (<span id="countAll">0</span>)</button>
      </div>

      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm theo STT (#1) hoặc từ khóa..." oninput="renderTable()">

      <div class="table-container">
        <table>
          <thead><tr><th style="width:46px;">STT</th><th>Tiêu đề bài viết</th><th style="width:75px;">Trạng thái</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">✓ Đã sao chép!</div>
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>

e/d/1INiK2T6XAp9-0ZyE5k6z3kQee3FBKLr3/view?usp=drivesdk","youtubeTitle":"Vì Sao Bạn Thấy Video Này? 3 Bài Học 'Ngược Đời' Để Chuyển Hóa Vận Mệnh Ngay Lập Tức","youtubeDesc":"Nếu bạn vô tình lướt thấy video này, đó không phải là sự ngẫu nhiên. Đó là tín hiệu từ tổ tiên và phước báo của chính bạn. \n\nTrong video này, chúng ta sẽ cùng chiêm nghiệm về quy luật 'Đồng bệnh tương lân' và cách để vận thế chuyển biến tốt đẹp thông qua 3 bài học nhân sinh sâu sắc:\n1. Nghệ thuật của sự 'Vừa đủ' trong ăn uống, đối nhân xử thế và tình cảm.\n2. Vì sao không nên thương hại hay cố gắng thay đổi người khác?\n3. Cách tránh vướng vào nhân quả của người khác để sống đời bình an.\n\n'Để hoa trở thành hoa, để cây trở thành cây' - Hãy cùng lắng nghe và thay đổi tư duy để thay đổi cuộc đời. Đừng quên nhấn Đăng ký để không bỏ lỡ những bài học thức tỉnh tiếp theo.","tiktok":"Dừng lại 3 giây! Tổ tiên của bạn đang tìm mọi cách để bạn thấy video này vì vận thế của bạn sắp chuyển mình. 🕊️ Đây không phải huyền học, mà là quy luật hút nhau của năng lượng. \n\nMuốn đời thanh thản, hãy nhớ: Đừng ăn quá no, đừng đối xử với ai QUÁ tốt và tuyệt đối đừng thương hại vận mệnh của người khác. Hãy để 'hoa trở thành hoa, cây trở thành cây'. Xem hết video để thấu hiểu quy luật nhân quả này nhé! 🌿 #trietlycuocsong #phongthuy #tamlinh #baihocnhansinh","facebook":"Có những cuộc gặp gỡ không phải tình cờ, mà là sự dẫn lối của tổ tiên để bạn thay đổi vận mệnh ngay lúc này. 🕊️\n\nNếu bạn nhìn thấy thông điệp này, có lẽ phước báo của bạn đã đủ đầy để chuyển hướng cuộc đời sang một trang mới. Đừng bỏ lỡ, vì nếu lướt qua, có thể phải chờ thêm vạn kiếp luân hồi mới gặp lại nhau.\n\n✨ 3 Quy tắc vàng để giữ gìn năng lượng và bình an:\n1. Cơm không ăn quá no, người không đối quá tốt: Mọi thứ vừa đủ mới là chân lý.\n2. Đừng cố thay đổi hay thương hại bất kỳ ai: Khi bạn thương hại, bạn đang gánh vác cả vận mệnh của họ. Hãy để hoa là hoa, để cây là cây, và để mỗi người tự đi trên hành trình của chính mình.\n3. Buông bỏ sự gánh vác dư thừa để tâm hồn được tự do.\n\nHãy sống chậm lại, thấu hiểu quy luật đồng bệnh tương lân để vạn sự hanh thông. \n\n#DaoLyNhanSinh #BaiHocCuocDoi #TrietLySong #PhatPhap #ChuaLanh\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi đến bạn một chút duyên lành hôm nay. 🌿\n\nMình vừa xem được những lời này và thấy rất đúng: 'Đừng ăn quá no, đừng đối xử quá tốt, cũng đừng gánh vác quá nhiều'. Đôi khi sự thương hại sai cách lại khiến chúng ta gánh thay vận mệnh của người khác. Hãy để mọi thứ thuận theo tự nhiên, để mỗi người tự học bài học của riêng mình. Chúc bạn một ngày tâm an và vận thế hanh thông nhé!","instagram":"Để hoa trở thành hoa, để cây trở thành cây... 🌸\n\nMọi sự gặp gỡ đều là duyên, mọi sự hiện diện đều có lý do. Đừng cố thay đổi thế giới, hãy thay đổi tần số của chính mình. Sự chừng mực trong tình cảm và hành động chính là chìa khóa của phước báo.\n.\n#wisdom #mindfulness #lifelessons #spiritual #daoly #binhan","pinnedComment":"Bạn tâm đắc nhất điều nào trong 3 bài học trên? Hãy để lại bình luận để chúng ta cùng gieo duyên lành nhé! ✨ Để thấu hiểu sâu sắc hơn về nghệ thuật đối nhân xử thế và cách làm chủ vận mệnh, bạn nên tìm đọc bộ đôi 'Sách Đắc Nhân Tâm & Nghệ Thuật Sống'. Đây là kim chỉ nam giúp bạn thay đổi tư duy và chạm tới thành công vững bền. Tham khảo tại giỏ hàng/link bio của mình nhé! 👇","affiliateSuggestions":"","productLink":""},{"stt":18,"category":"Đạo Lý Studio","title":"Video (28)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/15a419xlldz5kywMGdsNMkwSghM9Kd9DC/view?usp=drivesdk","youtubeTitle":"25 Dấu Hiệu Nhận Biết Kẻ Cáo Già: Bản Lĩnh Nhìn Thấu Nhân Tâm Để Sống Đời Tự Tại","youtubeDesc":"Trong cuộc đời, không phải ai cười với ta cũng là bạn. Video hôm nay sẽ bóc tách 25 biểu hiện của những người có tâm tư thâm sâu, giúp bạn trang bị tư duy nhạy bén và bản lĩnh vững vàng để đối diện với mọi nghịch cảnh. Đừng để bản thân trở nên quá ngây thơ giữa dòng đời đầy biến động. Hãy học cách thấu hiểu nhân tâm để sống một đời bình yên, trí tuệ và không bị thao túng.","tiktok":"Bạn có biết mình đang đối mặt với một kẻ 'cáo già'? 3 giây để nhận ra sự thật! Xem hết video này để nắm thóp 25 biểu hiện thâm sâu nhất: từ việc thích thăm dò riêng tư đến cách họ sử dụng người khác làm 'lá chắn' cho mình. Đừng để lòng tốt bị lợi dụng vì sự thiếu hiểu biết. Bản lĩnh là khi bạn nhìn thấu tất cả nhưng vẫn giữ được tâm thế bình thản. Xem ngay để tự bảo vệ mình bạn nhé!","facebook":"Lòng người là thứ khó đoán nhất thế gian. Có những người nhìn ngoài thì hiền lành, nhưng tâm tư lại thâm sâu như vực thẳm. Biết người, biết mặt nhưng khó biết lòng. \n\nDưới đây là những biểu hiện của một người 'cáo già' thực thụ mà bạn cần tỉnh táo để nhận diện:\n\n1. Thích thăm dò, đào bới chuyện người khác nhưng kín tiếng về mình.\n2. Dùng chút ơn huệ nhỏ để lôi kéo, ràng buộc tình cảm.\n3. Tính toán chi li, không để mình chịu thiệt dù chỉ một li.\n4. Đề phòng cực độ, chẳng bao giờ trao trọn niềm tin.\n5. Lật mặt nhanh hơn lật bánh tráng tùy theo đối tượng đối diện.\n6. Luôn đứng sau 'giật dây', để người khác đối đầu còn mình hưởng lợi.\n7. Ngôn ngữ điêu luyện, nói một hiểu mười, ẩn ý thâm sâu.\n\nHọc cách nhìn người không phải để chúng ta trở nên xấu đi, mà để xây dựng bản lĩnh vững vàng trước nghịch cảnh. Đừng để sự ngây thơ biến mình thành con cờ trong tay kẻ khác.\n\n#BanLinh #TrietLySong #BaiHocNhanSinh #PhatTrienBanThan #NhinThauLongNguoi\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn lời nhắc nhở chân thành: Cuộc đời này thật giả lẫn lộn, lòng người sâu hiểm khôn lường. Hãy cẩn trọng với những người thích thăm dò nhưng lại luôn giấu mình, những kẻ 'lật mặt' nhanh tùy theo lợi ích. Nhìn thấu lòng người chính là bước đầu của bản lĩnh. Chúc bạn luôn sáng suốt, vững tâm và bình an trước mọi sóng gió cuộc đời.","instagram":"Nhìn thấu nhân tâm, sống đời bản lĩnh. 🕯️ Đừng để sự hào nhoáng đánh lừa cảm quan, hãy thấu thị sự thật đằng sau những lời nói hoa mỹ. Sự thông tuệ là vũ khí tốt nhất trước nghịch cảnh. ✨\n.\n#LifeLessons #Maturity #Wisdom #Mindset #BanLinh #TrietLySong","pinnedComment":"Trong những biểu hiện trên, bạn thấy điều nào đáng sợ nhất ở một người thâm sâu? Chia sẻ trải nghiệm của bạn phía dưới nhé! 👇\n\nĐể trang bị tư duy nhạy bén, thấu hiểu lòng người và sống bản lĩnh hơn mỗi ngày, hãy tìm đọc bộ đôi 'Sách Đắc Nhân Tâm & Nghệ Thuật Sống'. Đây là hành trang không thể thiếu để bạn làm chủ mọi mối quan hệ và nghịch cảnh. \n👉 Đặt sách chính hãng tại link ở Bio/Giỏ hàng của mình nhé!","affiliateSuggestions":"","productLink":""},{"stt":19,"category":"Đạo Lý Studio","title":"Video (27)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1omkCIPbqGs1NYRyMjlKRp5O8A4f0ItJ_/view?usp=drivesdk","youtubeTitle":"Bí Mật Của Sự Im Lặng: Tại Sao Càng Ít Nói, Đời Càng An Nhiên? | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Trong thế giới ồn ào này, im lặng chính là một loại năng lực đỉnh cao. Đừng để năng lượng của mình bị tiêu hao bởi những mối quan hệ rườm rà hay những người không cùng tần số. \n\nVideo hôm nay chia sẻ về Nghệ Thuật Im Lặng & Tu Dưỡng Khẩu Đức - kim chỉ nam giúp bạn giữ vững tâm thế giữa dòng đời vạn biến. Hãy học cách bớt mong cầu, bớt chia sẻ và tập trung vào việc rèn luyện nội lực. Khi bạn đủ mạnh mẽ, bạn sẽ không còn phụ thuộc vào sự yêu ghét của người đời.\n\n💎 Những bài học chính trong video:\n- Tại sao không nên để người khác hiểu quá nhiều về bạn?\n- Nghệ thuật buông bỏ kỳ vọng để tránh tự hủy.\n- Cách tập trung năng lượng để thành công và thu hút những điều tích cực.\n\nHãy nhấn Đăng ký để cùng chiêm nghiệm những bài học nhân sinh giá trị mỗi ngày nhé!","tiktok":"Bạn có biết: Sai lầm lớn nhất là để người khác hiểu quá rõ về mình? 🛑\n\nCàng chia sẻ nhiều, bạn càng dễ bị tổn thương. Càng chiều chuộng, người ta càng dễ phản cảm. Đừng kỳ vọng ai đó sẽ đối tốt với bạn, vì đó là con đường ngắn nhất dẫn đến sự tiêu hao năng lượng. \n\nHãy học cách im lặng, giảm bớt nhu cầu được thấu hiểu và tập trung hoàn toàn vào việc nâng cấp giá trị bản thân. Khi bạn đủ mạnh, bạn không còn cần 'giá trị cảm xúc' từ ai khác, và đó mới là lúc bạn thực sự tự do.\n\nXem hết video này để hiểu tại sao im lặng lại là quyền năng lớn nhất của bạn! ✨\n\n#songchat #baihoccuocdoi #phattrienbanthan #imlang","facebook":"Đừng để bất kỳ ai hiểu quá rõ về bạn. Đừng tiến quá gần, cũng đừng kỳ vọng quá nhiều...\n\nSự thật là: Khi bạn càng nỗ lực chiều chuộng, người ta càng dễ phản cảm. Khi bạn càng đối tốt vô điều kiện, người ta càng dễ chán chường. Kỳ vọng vào một ai đó khác chính là một dạng 'tự hủy' chậm rãi, bào mòn năng lượng và sự kiêu hãnh của chính mình.\n\nNăng lượng của chúng ta là hữu hạn. Thay vì tiêu hao vào những mối quan hệ rườm rà hay những người không cùng tần số, hãy tập trung vào việc làm cho bản thân mình mạnh mẽ hơn. Chỉ khi bạn đủ giỏi, đủ bản lĩnh, thế giới mới tự tìm đến bạn theo cách tôn trọng nhất.\n\nIm lặng không phải là yếu đuối, im lặng là sự tu dưỡng khẩu đức đỉnh cao. Hãy ít nói lại, hành động nhiều hơn, và học cách yêu thương chính mình trước khi đợi chờ tình yêu từ thiên hạ.\n\n#TrietLySong #NgheThuatImLang #TuDuongKhauDuc #BaiHocNhanSinh #PhatTrienBanThan\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn, đôi khi im lặng và giữ khoảng cách lại là cách tốt nhất để bảo vệ chính mình. Đừng quá kỳ vọng vào người khác, cũng đừng để bản thân bị cuốn vào những mối quan hệ không tên. Hãy dành thời gian tu dưỡng tâm hồn, tập trung vào công việc và mục tiêu của riêng mình. Chúc bạn luôn bình yên, mạnh mẽ và tìm thấy giá trị đích thực từ bên trong nhé! ❤️","instagram":"Năng lượng của chúng ta là để dành cho chính mình. Hãy học cách im lặng, bớt mong cầu và ngừng chia sẻ quá mức. Sự rực rỡ nhất của một người là khi họ đủ mạnh mẽ để không cần dựa dẫm vào giá trị cảm xúc từ bất kỳ ai. ✨\n.\n#silence #minimalism #innerpeace #growth #mindset #philosophy","pinnedComment":"Trong những lúc mệt mỏi nhất, bạn chọn cách im lặng để tự chữa lành hay chọn chia sẻ với ai đó? Hãy cùng thảo luận bên dưới nhé! 👇\n\nNếu bạn đang tìm kiếm sự tĩnh lặng trong tâm hồn và muốn thấu hiểu nghệ thuật đối nhân xử thế đỉnh cao, đừng bỏ lỡ bộ đôi 'Sách Đắc Nhân Tâm & Nghệ Thuật Sống'. Đây chính là chìa khóa để thay đổi tư duy, tu dưỡng khẩu đức và làm chủ cuộc đời mình. \n\n👉 Chi tiết bộ sách tại link ở Bio/Giỏ hàng của mình nhé! 📚✨","affiliateSuggestions":"","productLink":""},{"stt":20,"category":"Đạo Lý Studio","title":"Video (26)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1MK_VefibpwAYZcVzf33o-cpuOGYmqY3m/view?usp=drivesdk","youtubeTitle":"Bí Mật Của Sự Tự Tin: Tại Sao Bạn Không Nên Dựa Dẫm Vào Bất Cứ Ai? | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Bạn đang cảm thấy chênh vênh khi mất đi một điểm tựa? Hãy nhớ rằng: Con chim đậu trên cành cây không bao giờ sợ cành gãy, vì niềm tin của nó nằm ở đôi cánh, không phải ở cành cây. \n\nTrong video hôm nay, chúng ta sẽ cùng chiêm nghiệm về bài học 'Thấu hiểu bản thân - Làm chủ cuộc đời'. Cổ nhân dạy rằng mọi sự dựa dẫm vào ngoại cảnh đều là phù du. Chỉ có nội lực và niềm tin vào chính mình mới là nền tảng vững chắc nhất để bạn đứng vững trước mọi biến cố cuộc đời.\n\n🔔 Đừng quên nhấn Like, Share và Đăng ký kênh để đón xem thêm nhiều video triết lý nhân sinh ý nghĩa mỗi ngày nhé!","tiktok":"Tại sao con chim không bao giờ sợ cành cây gãy? 🕊️ Câu trả lời sẽ thay đổi hoàn toàn cách bạn đối diện với khó khăn. Đừng bao giờ đặt cược sự an nguy của mình vào tay người khác. Cổ nhân nói rồi: Dựa núi núi lở, dựa người người đi. Chỗ dựa duy nhất không bao giờ sụp đổ chính là bản lĩnh của chính bạn. Xem hết video này để biết cách rèn luyện 'đôi cánh' của mình nhé! 💡 #BaiHocCuocDoi #PhatTrienBanThan #DongLuc #SongCoChat","facebook":"Bạn đã bao giờ tự hỏi, tại sao con chim đậu trên cành cây lại không bao giờ lo sợ cành cây sẽ gãy? 🕊️\n\nCâu trả lời không nằm ở sự chắc chắn của cành cây, mà nằm ở đôi cánh của chính nó. Niềm tin của nó đặt ở khả năng của bản thân, chứ không phải ở ngoại cảnh.\n\nTrong cuộc đời này cũng vậy. Cổ nhân có dạy: 'Dựa vào cây, cây sẽ ngã; dựa vào núi, núi sẽ lở; dựa vào người, người cũng sẽ rời đi'. Khi chúng ta đặt kỳ vọng quá lớn vào một ai đó hay một hoàn cảnh nào đó, chúng ta sẽ luôn sống trong lo âu và sợ hãi sự thay đổi.\n\nChỗ dựa vững chắc nhất, bền bỉ nhất và không bao giờ phản bội bạn - chính là BẢN THÂN BẠN. Dù bạn đang đứng ở đâu, trong hoàn cảnh khó khăn thế nào, hãy luôn tin tưởng vào nội lực của mình. Khi đôi cánh của bạn đủ mạnh, bạn sẽ làm chủ mọi bầu trời.\n\n#TrietLySong #BaiHocNhanSinh #PhatTrienBanThan #TuTin #SongVungVang\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn một chút năng lượng bình yên cho ngày mới. 🌿 Hãy nhớ rằng, dù thế giới ngoài kia có thay đổi ra sao, người duy nhất có thể bảo vệ và đưa bạn đi xa nhất chính là chính bạn. Đừng sợ hãi khi phải đứng một mình, vì bạn sở hữu đôi cánh của riêng mình. Chúc bạn luôn vững tin và mạnh mẽ trên hành trình cuộc đời! ❤️","instagram":"Niềm tin không nằm ở cành cây, nó nằm ở đôi cánh. 🕊️✨\n\nDựa vào núi, núi lở. Dựa vào người, người đi. Chỉ có dựa vào chính mình mới là bến đỗ bình yên và vững chãi nhất. Hãy không ngừng nâng tầm giá trị bản thân bạn nhé.\n.\n#Philosophy #SelfGrowth #Motivation #InnerPeace #SongNhuNhungDoaHoa","pinnedComment":"Nếu ngày mai mọi điểm tựa xung quanh đều mất đi, bạn có đủ tự tin vào 'đôi cánh' của mình không? 🕊️ Hãy chia sẻ cảm nghĩ của bạn bên dưới nhé! Để rèn luyện nội lực và làm chủ nghệ thuật đối nhân xử thế, các bạn nên đọc combo sách 'Đắc Nhân Tâm & Nghệ Thuật Sống' - chìa khóa thay đổi tư duy và vận mệnh. Link sách chính hãng mình để ở Bio/Giỏ hàng nha! 👇","affiliateSuggestions":"","productLink":""},{"stt":21,"category":"Đạo Lý Studio","title":"Video (25)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/11bDIUDoNlcVb5erdzoM9XDRhV-G85Sz0/view?usp=drivesdk","youtubeTitle":"SỰ THẬT TÀN NHẪN VỀ NHÂN TÍNH: Nghe Để Bớt Chịu Thiệt Thòi | Bài Học Cuộc Đời","youtubeDesc":"Đừng mở loa ngoài, hãy tìm một nơi vắng người để chiêm nghiệm. Hôm nay, chúng ta sẽ cùng bóc tách những sự thật trần trụi về con người có thể làm đảo lộn nhận thức của bạn. \n\nTrong video này bạn sẽ hiểu:\n- Tại sao người lạ lại muốn làm quen với bạn?\n- Bản chất thực sự của tình thân và sự gắn kết là gì?\n- Sai lầm về kỳ vọng trong hôn nhân.\n- Tại sao phải thực hiện ngay những mong muốn của bản thân khi còn có thể?\n\nĐừng quên nhấn Đăng ký kênh để cập nhật những bài học nhân sinh sâu sắc mỗi ngày.","tiktok":"ĐỪNG NGHE VIDEO NÀY CHỖ ĐÔNG NGƯỜI! 🤫\n\nĐây là những sự thật về nhân tính có thể khiến bạn sốc:\n1. Người lạ tìm đến bạn thường vì 'dụng ý' chứ không phải vì bạn 'thú vị'.\n2. Máu mủ chỉ là cái tên, lợi ích và cách đối đãi mới tạo nên tình thân.\n3. Luật pháp bảo vệ tài sản, không bảo vệ tình yêu.\n4. Đừng đợi đến khi có đủ tiền mới đi chơi, có đủ thời gian mới yêu thương. Vì lúc đó, tâm trạng của bạn đã nguội lạnh rồi.\n\nXem hết video này để bớt chịu thiệt thòi trong đời nhé! 💡\n#xuhuong #baihoccuocdoi #phattrienbanthan #trietly","facebook":"Đừng mở loa ngoài, hãy tìm một nơi vắng người để lén nghe. Đừng trách tôi không nhắc bạn trước, bởi những sự thật dưới đây có thể khiến bạn ám ảnh và đảo lộn hoàn toàn nhận thức bấy lâu nay.\n\nNghe thêm một lần, bạn sẽ bớt đi một lần chịu thiệt thòi:\n\n1. Người lạ sẵn sàng kết giao với bạn, không phải vì bạn thú vị, mà vì bạn có giá trị để họ lợi dụng.\n2. Tình thân đôi khi chỉ là cái mác. Đứa trẻ thân với người chăm sóc khi nhỏ, thân với người không quản thúc khi dậy thì, và thân với người cho nó tiền khi trưởng thành. Nhân tính và lợi ích mới là thứ quyết định sự gắn kết thực sự.\n3. Luật hôn nhân chỉ bảo vệ được tài sản và quyền lợi, tuyệt đối không thể bảo vệ được tình yêu.\n4. Hãy trân trọng những khao khát hiện tại. Bởi con người hiếm khi có đủ: Tiền bạc - Thời gian - và Tâm trạng cùng một lúc. Có những việc giờ không làm, sau này e rằng không còn cơ hội.\n\nThấu hiểu nhân tính để sống một đời tự tại. Bạn chọn thức tỉnh hay tiếp tục mộng mị?\n\n#daolynhansinh #baihoccuocdoi #trietlysong #phattrienbanthan #nhantinh\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn một vài chiêm nghiệm về cuộc đời. Có những sự thật nghe thì đau lòng, nhưng thấu hiểu sớm sẽ giúp mình bớt chịu thiệt thòi và sống lý trí hơn. Chúc bạn luôn vững vàng và trân trọng những gì mình đang có nhé! 🙏","instagram":"Sự thật đôi khi gây ám ảnh, nhưng sự thật giúp chúng ta tỉnh thức. 🖋️\n\n1. Lợi ích quyết định mối quan hệ.\n2. Nhân tính quyết định tình thân.\n3. Luật pháp không bảo vệ được trái tim.\n4. Thời điểm tốt nhất là NGAY BÂY GIỜ.\n\nĐừng đợi đến khi có tiền, có thời gian mới sống cho mình. Lúc đó, tâm trạng đã khác rồi.\n\n#wisdom #lifequotes #deepthoughts #trietlysong #phattrienbanthan","pinnedComment":"Trong 4 sự thật trên, điều nào khiến bạn thấy 'thấm' nhất? Hãy để lại ý kiến dưới phần bình luận nhé! Để thấu hiểu nhân tâm và làm chủ nghệ thuật sống, bạn nhất định nên đọc bộ sách 'Đắc Nhân Tâm & Nghệ Thuật Sống'. Link sở hữu sách tại Bio/Giỏ hàng để thay đổi tư duy từ hôm nay! 👇","affiliateSuggestions":"","productLink":""},{"stt":22,"category":"Đạo Lý Studio","title":"Video (24)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1AfqSoMrhipQsmu0LFJMcOsXWqhvT3wuH/view?usp=drivesdk","youtubeTitle":"Dấu Hiệu Nguy Hiểm Khi Bạn Mất Hứng Thú Với Mọi Thứ | Bài Học Nhân Sinh Sâu Sắc","youtubeDesc":"Bạn cảm thấy cuộc sống bỗng chốc trở nên xám xịt? Mọi sở thích cũ đều biến mất và mỗi ngày trôi qua chỉ là sự lặp lại máy móc? \nNhiều người gọi đó là kiệt sức, nhưng thực chất đó là giai đoạn 'Chai sạn nhận thức'. Trong video này, chúng ta sẽ cùng phân tích:\n- Tại sao bộ não lại rơi vào chế độ 'tiết kiệm điện' khiến bạn mất cảm xúc.\n- 3 nguyên nhân cốt lõi: Vùng an toàn, quá tải thông tin và thiếu mục tiêu.\n- Hành trình 21 ngày thực tế để gỡ bỏ sự chai sạn và tìm lại bản ngã đầy nhiệt huyết.\nHứng thú không phải để chờ đợi, hứng thú là để tạo ra. Đừng để cuộc đời mình trôi qua trong sự trống rỗng.","tiktok":"Mất hứng thú với mọi thứ không phải là trầm cảm! Đó là 'Chai sạn nhận thức'. Bạn đang lướt video này trong sự vô định đúng không? Càng lướt càng thấy trống rỗng vì bạn đang dùng sai cách để chữa lành. Bộ não bạn đang 'đình công' vì thiếu thử thách và thừa thông tin rác. Dừng lại ngay việc nạp 'rác' vào đầu. Hãy xem hết video này để biết 3 bước khởi động lại hệ thống nhận thức và tìm lại nhiệt huyết ngay hôm nay. #baihocnhansinh #phattrienbanthan #dongluc","facebook":"BẠN KHÔNG HỀ TRẦM CẢM, BẠN CHỈ ĐANG BỊ 'CHAI SẠN NHẬN THỨC'\n\nBạn bắt đầu thấy mọi thứ nhạt nhẽo? Công việc từng yêu thích giờ chỉ là gánh nặng? Bạn lướt điện thoại vô định nhưng càng xem càng thấy trống rỗng? Đừng vội kết luận đó là mệt mỏi thông thường. Đây là tín hiệu báo động đỏ từ hệ thống nhận thức của bạn.\n\nKhi bộ não rơi vào trạng thái 'tiết kiệm điện' do lặp lại những thói quen vô thưởng vô phạt quá lâu, nó sẽ tự động giảm xung nhịp. Kết quả là bạn sống như một 'cái xác không hồn'.\n\nĐể thoát ra, bạn không cần nghỉ ngơi, bạn cần TÁI TẠO:\n1. Ngắt kết nối với thông tin rác (Video ngắn, game, mạng xã hội).\n2. Ép mình làm một việc mới mỗi ngày.\n3. Thiết lập một mục tiêu đủ lớn để dấn thân.\n\nHứng thú không tự nhiên đến, nó được sinh ra từ quá trình bạn sáng tạo và thử thách chính mình. Hãy tỉnh thức trước khi tâm hồn bạn hoàn toàn nguội lạnh.\n\n#TrietLyCuocSong #BaiHocNhanSinh #PhatTrienBanThan #ChaiSanNhanThuc\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn, nếu dạo này bạn cảm thấy mệt mỏi và không còn tha thiết với điều gì, đừng quá lo lắng hay ép bản thân phải 'vui lên' ngay lập tức. Có lẽ tâm hồn bạn chỉ đang cần một đợt 'tái tạo' lại nhận thức sau những ngày dài lặp lại vô vị. Hãy thử tắt điện thoại, đi một con đường mới hoặc nấu một món ăn chưa từng thử. Hy vọng bài chia sẻ này sẽ giúp bạn tìm lại được ánh sáng và mục tiêu cho riêng mình. Chúc bạn một ngày bình yên!","instagram":"Mất hứng thú không phải là điểm kết thúc, mà là lời hồi chuông nhắc bạn phải thay đổi. Đừng để 'sự chai sạn nhận thức' nuốt chửng tâm hồn bạn. Hãy chọn sáng tạo thay vì tiêu thụ rác thông tin. 🌿\n.\n#mindset #productivity #growth #mentalhealth #trietly","pinnedComment":"Bạn có đang thấy mình giống như 'chiếc máy tính bị đơ' vì lặp lại một nhịp sống quá lâu không? Bạn đã thử làm điều gì mới mẻ trong hôm nay chưa? Hãy chia sẻ câu chuyện của bạn bên dưới nhé. Nếu cần một công cụ để bắt đầu hành trình tái tạo lại bản thân, đừng quên ghé link bio của mình để tham khảo bộ sách và sổ tay rèn luyện tư duy nhé!","affiliateSuggestions":"Sổ tay lập kế hoạch hành động\nSách Hiểu về trái tim\nSách Lối sống tối giản của người Nhật\nĐồng hồ báo thức kỹ thuật số phong cách gỗ\nThảm tập Yoga chống trượt","productLink":""},{"stt":23,"category":"Đạo Lý Studio","title":"Video (23)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1g2wyi8plpa42Ry9Lv4Hx-mhsjdfPEPUC/view?usp=drivesdk","youtubeTitle":"Khi Cả Thế Giới Quay Lưng Vì Bạn Nghèo: Bài Học Vô Giá Để Vực Dậy Cuộc Đời","youtubeDesc":"Bạn đang ở dưới đáy vực của sự bế tắc? Nợ nần, không tiền bạc, bị khinh thường... Video này dành cho những ai đang cảm thấy tuyệt vọng. Hãy nhớ rằng: Một chiếc ví rỗng và một chiếc bụng đói là những người thầy tốt nhất. Đừng buông xuôi, hãy biến nỗi nhục nhã thành động lực để rèn luyện trí tuệ và bản lĩnh. Ánh sáng luôn ở cuối đường hầm cho những ai không ngừng cố gắng. Chúc bạn sớm vượt qua giông bão để tìm thấy vinh quang của riêng mình.","tiktok":"Thứ dạy bạn trưởng thành nhanh nhất không phải trường học, mà là một chiếc ví rỗng! 💸\n\nCảm giác nợ nần, không tiền, bị người đời khinh thường... đau đớn thật đấy, nhưng đó chính là cơ hội để bạn rèn luyện bản lĩnh. Đừng buông xuôi, hãy dùng sự nhục nhã làm bàn đạp để bứt phá trí tuệ. \n\nChỉ cần bạn không bỏ cuộc, ánh sáng chắc chắn sẽ hiện ra. Xem hết video này để vực lại tinh thần ngay nhé! 💡\n\n#dongluc #growth #baihoccuocdoi #vượtkhó","facebook":"Có những ngày, bản thân chẳng có gì trong tay: không tiền, không xe, nợ nần bủa vây. Đó là khi bạn thấm thía nhất cái lạnh lẽo của lòng người và sự khinh thường của xã hội.\n\nNhưng đừng vội tuyệt vọng! Hãy nhớ rằng: Một chiếc bụng đói, một chiếc ví rỗng và một tương lai mịt mù chính là những người thầy vĩ đại nhất. Chúng không đến để dìm chết bạn, mà để dạy bạn bài học vô giá về bản lĩnh và trí tuệ.\n\nĐừng buông xuôi, đừng tự ti. Hãy coi nghịch cảnh là lò lửa để tôi luyện nên một tinh thần thép. Khi bạn tin vào chính mình, bạn sẽ tìm thấy ánh sáng ngay trong những ngày tăm tối nhất. Cố gắng lên, thành công đang đợi người không bỏ cuộc!\n\n#daolynhansinh #baihoccuocdoi #dongluc #vuonlen #phattrienbanthan\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn, người đang gồng gánh những lo toan bộn bề. Có những ngày tay trắng, nợ nần, cảm thấy cả thế giới quay lưng... mình hiểu cảm giác đó rất nhục nhã. Nhưng đừng nản chí nhé. Hãy coi đó là cơ hội để rèn mình cứng cáp hơn. Chúc bạn chân cứng đá mềm, sớm vượt qua gian khó và tìm thấy ánh sáng cho riêng mình. Cố gắng lên bạn tôi!","instagram":"Bụng đói dạy ta giá trị của lao động. Ví rỗng dạy ta giá trị của đồng tiền. Sự khinh thường dạy ta giá trị của bản lĩnh. Đừng bỏ cuộc, vì kim cương luôn được tạo ra dưới áp lực cực đại. ✨\n.\n#motivation #mindset #lifelessons #growth #phattrienbanthan","pinnedComment":"Bạn đã từng trải qua cảm giác bị cả thế giới quay lưng khi trắng tay chưa? Hãy chia sẻ câu chuyện của bạn bên dưới để chúng ta cùng tiếp thêm động lực cho nhau nhé. Đừng quên ghé link Bio/Giỏ hàng của mình để tìm những 'người bạn' giúp thay đổi tư duy và vực dậy bản lĩnh nhé! 👇","affiliateSuggestions":"Sách Thay đổi tư duy thay đổi vận mệnh\nSách Nghĩ giàu và làm giàu\nSổ tay lập kế hoạch hành động 90 ngày\nSách Chiến thắng con quỷ trong bạn\nSách Khéo ăn nói sẽ có được thiên hạ","productLink":""},{"stt":24,"category":"Đạo Lý Studio","title":"Video (22)","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1GmjbahOR7gv3Rt1W5yeIhZ9IynySUoPE/view?usp=drivesdk","youtubeTitle":"Ly Hôn Nên Để Con Cho Bố Hay Mẹ? Sự Thật Tàn Nhẫn Nhưng Giúp Con Có Tương Lai Vững Chắc Nhất","youtubeDesc":"Trong cuộc chiến ly hôn, quyền nuôi con luôn là vấn đề đau lòng nhất. Chúng ta thường nói 'con không mẹ như cá mất đầu', nhưng thực tế xã hội lại có những góc khuất khác. \n\nVideo này chia sẻ góc nhìn về việc tại sao để con ở lại với gia đình bên nội đôi khi lại là lựa chọn tốt nhất cho tâm lý và tương lai của trẻ. Không phải là trốn tránh trách nhiệm, mà là sự hy sinh thầm lặng của người mẹ để con có một nền tảng gia tộc vững chắc, trong khi bản thân người mẹ nỗ lực trở thành một 'hậu phương' tài chính và tinh thần vững mạnh.\n\nBài học về nhân tính, về huyết thống và cách lựa chọn thông minh cho phụ nữ sau ly hôn.","tiktok":"Tại sao ly hôn xong để con cho bố nuôi lại là cách thương con nhất? Đừng vội phản bác, hãy nghe hết video này để thấy thực tế phũ phàng về 'người thân' và 'người ngoài'. Sự tự tin của đứa trẻ đến từ vị thế trong gia đình, không phải chỉ từ những lời vỗ về lúc nghèo khó. Xem ngay để có cái nhìn khách quan nhất cho tương lai của con bạn! #lyhon #nuoicon #giadinh #baihoccuocdoi","facebook":"ĐỪNG VÌ SỰ ÍCH KỶ CỦA TÌNH MẪU TỬ MÀ ĐỂ CON PHẢI KHỔ CẢ ĐỜI...\n\nNhiều người sẽ mắng tôi là tàn nhẫn khi nói rằng: Sau ly hôn, hãy để con cho bố nuôi. Nhưng hãy bình tĩnh lại và nhìn thẳng vào nhân tính.\n\nỞ nhà nội, ngoài mẹ kế, tất cả đều là máu mủ. Đứa trẻ có nguồn gốc, có vị thế và có sự bảo bọc của ông bà nội - những người coi nó là huyết thống nguyên thủy. Nó không cần nhìn sắc mặt ai để được ăn thêm một miếng ngon.\n\nNhưng ở nhà ngoại hay trong gia đình mới của mẹ, ngoài mẹ ra, tất cả đều là người ngoài. Những ánh mắt dò xét của cậu mợ, hay sự khách sáo của cha dượng sẽ biến đứa trẻ trở nên nhạy cảm và tự ti. \n\nLùi lại một bước, nỗ lực sự nghiệp để trở thành chiếc phao cứu sinh tài chính cho con, hay ôm con cùng vật lộn ở đáy xã hội rồi cả hai cùng kiệt sức? Thương con đúng cách là chọn cho con con đường vững chắc nhất, chứ không phải là chọn cách để mình bớt đau lòng.\n\n#LyHon #NuoiCon #DaoLyNhanSinh #BaiHocCuocDoi #PhuNuManhMe\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi những người phụ nữ đang đứng trước ngưỡng cửa ly hôn: Hãy chọn cho con một điểm tựa thay vì một gánh nặng. Đôi khi buông tay để con ở lại với gia đình nội lại là cách bảo vệ sự tự tin và thân phận của con tốt nhất. Hãy nỗ lực để trở thành niềm tự hào và là phao cứu sinh cho con sau này. Chúc bạn luôn tỉnh táo và bản lĩnh.","instagram":"Thương con bằng lý trí, đừng chỉ bằng cảm xúc. Hãy để con thắng ở nguồn lực gia tộc, và mẹ thắng ở chất lượng đồng hành. Một người mẹ mạnh mẽ là người dám chọn con đường tốt nhất cho con, dù bản thân phải chịu tiếng vang không hay. ✨ #wisdom #parenting #divorce #strongwomen #lifequotes","pinnedComment":"Lựa chọn nào cũng đau lòng, nhưng lựa chọn nào sẽ giúp con có tương lai vững chắc hơn? Nếu là bạn, bạn sẽ chọn ôm con cùng khổ hay lùi lại để làm điểm tựa tài chính vững vàng cho con? Chia sẻ góc nhìn của bạn nhé. Nếu bạn đang cần tìm lại sự cân bằng và bản lĩnh, hãy tham khảo danh sách sách hay ở link bio nhé!","affiliateSuggestions":"Sách Vô cùng tàn nhẫn vô cùng yêu thương\nSách Hiểu về trái tim\nSách Phụ nữ hiện đại viết lại cuộc đời\nSách Chữa lành nỗi đau sau ly hôn\nSổ tay lập kế hoạch tài chính cá nhân","productLink":""},{"stt":31,"category":"Đạo Lý Studio","title":"Video (15)","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1wJbCorvY8XBf6UvZrXSd3HZ7ZOP_JLro/view?usp=drivesdk","youtubeTitle":"Bí Mật Phong Thủy Trên Cơ Thể Người: Quan Trọng Gấp 10 Lần Nhà Ở | Bài Học Nhân Sinh","youtubeDesc":"Phong thủy của một người thực chất nằm ở chính cách họ sống, nói năng và hành xử hàng ngày. Trong video này, chúng ta sẽ cùng khám phá 3 nơi phong thủy quan trọng nhất trên cơ thể mà nếu biết cách 'bảo trì', con đường đời của bạn sẽ ngày càng rộng mở.\n\nNội dung bài học:\n- Tại sao quản lý lời nói lại là tu dưỡng phúc báo?\n- Tầm nhìn của người trí tuệ qua việc không tham lợi nhỏ.\n- Sự lương thiện và luật nhân quả của đất trời.\n\nNếu bạn đang tìm kiếm một phương pháp thực hành phong thủy khoa học, thực tế và không mê tín, hãy tham khảo cuốn sách 'Phong Thủy Khai Vận' được nhắc đến trong video để điều hòa vận khí và giữ tâm an lạc.\n\nĐừng quên Đăng ký kênh để cùng chiêm nghiệm những bài học nhân sinh sâu sắc mỗi ngày!","tiktok":"Dừng lại 1 giây nếu bạn muốn đổi vận! 🛑 Phong thủy trên cơ thể bạn quan trọng gấp 10 lần phong thủy nhà ở. Bạn có biết 3 vị trí này không? \n1. Cái miệng: Nói lời thiện lành, phúc khí tự đến. \n2. Sự liêm chính: Không tham lợi nhỏ, ắt có đại đồ. \n3. Tấm lòng: Lương thiện là lá bùa bình an nhất. \nXem hết video này để biết cách nuôi dưỡng 3 'vùng đất vàng' giúp cuộc đời bạn thăng tiến hướng lên. Đừng quên comment 'Phong Sinh Thủy Khởi' để nhận năng lượng tích cực ngay hôm nay! #phongthuy #trietlycuocsong #phatphap","facebook":"✨ PHONG THỦY TRÊN CƠ THỂ MỘT NGƯỜI QUAN TRỌNG GẤP 10 LẦN PHONG THỦY NGÔI NHÀ\n\nNhiều người lặn lội tìm thầy xem hướng nhà, đặt vật phẩm cầu may mà không biết rằng, trên chính cơ thể mỗi người đã có 3 nơi \"phong thủy\" cực thịnh. Nếu biết cách tu dưỡng, cuộc đời ắt sẽ hanh thông, thăng tiến:\n\n1️⃣ CÁI MIỆNG: \"Đa ngôn số cùng, bất như thủ trung\". Lời nói thiện lành tạo năng lượng tích cực, lời than vãn chỉ mang lại vận xui. Quản tốt cái miệng là giữ được phúc báo cho chính mình.\n\n2️⃣ SỰ LIÊM CHÍNH: Đừng tham lợi nhỏ mà đánh mất tiền đồ lớn. Tầm vóc một người nằm ở việc không chiếm tiện nghi của người khác.\n\n3️⃣ LÒNG LƯƠNG THIỆN: Đừng sợ người hiền bị bắt nạt. Ông trời luôn có mắt, mọi việc bạn làm đất trời đều chứng giám. Vận may không do cầu xin, mà do tu dưỡng mà thành.\n\nNếu bạn đồng cảm với điều này, hãy thầm nhủ 4 chữ \"Phong Sinh Thủy Khởi\" trong lòng để đón nhận những điều tốt đẹp nhất sắp tới nhé!\n\n#DaoLyNhanSinh #BaiHocCuocDoi #PhongThuy #TuTam #PhatTrienBanThan\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Gửi bạn lời nhắn nhủ chân thành về 'Phong thủy trên cơ thể người'. Đôi khi chúng ta quá mải mê tìm kiếm may mắn bên ngoài mà quên mất rằng cái miệng, lòng tham và sự lương thiện của chính mình mới là nguồn gốc của phúc báo. Hãy cùng dành ít phút chiêm nghiệm video này để tâm thêm an, đời thêm hưng thịnh bạn nhé. Chúc bạn một ngày 'Phong sinh thủy khởi'!","instagram":"Phong thủy tốt nhất chính là Tâm thái của bạn. ✨\n\n3 nơi phong thủy trên cơ thể cần tu dưỡng:\n👄 Cái miệng: Nói lời ấm áp, tích cực.\n🙌 Sự liêm chính: Không tham lợi nhỏ trước mắt.\n❤️ Tấm lòng: Giữ sự lương thiện dù thế gian biến đổi.\n\nTu dưỡng tâm tính chính là cách tốt nhất để thay đổi vận mệnh. 🌿\n\n#mindfulness #spirituality #phongthuy #trietly #songdep #phongthuykhaivan","pinnedComment":"Bạn tin vào điều nào nhất trong 3 nơi phong thủy trên? Hãy comment 'Phong Sinh Thủy Khởi' nếu bạn đã sẵn sàng tu dưỡng để đón nhận vận may mới! Mọi người có thể tìm hiểu thêm cách điều hòa vận khí khoa học qua cuốn sách 'Phong Thủy Khai Vận' mình để ở link giỏ hàng/bio nhé! 👇","affiliateSuggestions":"Sách Phong Thủy Khai Vận\nSách Đạo Đức Kinh - Lão Tử\nVòng tay Trầm Hương tự nhiên\nNhang trầm hương cao cấp\nSổ tay thực hành lòng biết ơn","productLink":""},{"stt":32,"category":"Đạo Lý Studio","title":"Nghệ Thuật Im Lặng & Tu Dưỡng Khẩu Đức","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1-5nB01ww1feLAAwt7xMLblq7yzHZobkg/view?usp=sharing","youtubeTitle":"ÍT NÓI LÀ MAY MẮN - GIỮ MIỆNG GIỮ PHÚC KHÍ | Đạo Lý Nhân Sinh","youtubeDesc":"Video chia sẻ bài học sâu sắc về Nghệ Thuật Im Lặng & Tu Dưỡng Khẩu Đức.\n\nĐi thăm người bệnh trực tiếp đưa tiền. Tiếp đón họ hàng nghèo ra nhà hàng cao cấp bên ngoài ăn. Tiếp đón họ hàng giàu thì tự tay xuống bếp nấu ăn. Bạn hãy ghi nhớ thật kỷ những câu nói này, bởi vì hôm nay những nhận thức xã giao mà tôi sắp chia sẻ với bạn, sẽ không có ai trực tiếp dậy bạn, nhưng mỗi một điều đều là những bài học đặt giá được đổi bằng tiền sư…\n\nĐăng ký kênh để cùng chiêm nghiệm thêm nhiều bài học ý nghĩa.","tiktok":"Mất vài năm để học nói, nhưng có khi mất cả đời để học cách im lặng.\n\nXem hết video để hiểu trọn vẹn bài học này. #baihocnhansinh #trietlycuocsong","facebook":"Mất vài năm để học nói, nhưng có khi mất cả đời để học cách im lặng.\n\nĐi thăm người bệnh trực tiếp đưa tiền. Tiếp đón họ hàng nghèo ra nhà hàng cao cấp bên ngoài ăn. Tiếp đón họ hàng giàu thì tự tay xuống bếp nấu ăn. Bạn hãy ghi nhớ thật kỷ những câu nói này, bởi vì hôm nay những nhận thức xã giao mà tôi sắp chia sẻ với bạn, sẽ không có ai trực tiếp dậy bạn, nhưng mỗi một điều đều là những bài học đặt giá được đổi bằng tiền sư…\n\n#TrietLySong #BaiHocNhanSinh #DaoLySong\n\n#phuchocdieuhay #baihoccuocsong #daycon #giadinh #songtute","zalo":"Mất vài năm để học nói, nhưng có khi mất cả đời để học cách im lặng.\n\nGửi tặng bạn video ý nghĩa về Nghệ Thuật Im Lặng & Tu Dưỡng Khẩu Đức.","instagram":"Mất vài năm để học nói, nhưng có khi mất cả đời để học cách im lặng.\n\nÍT NÓI GIỮ PHÚC\n\n#trietlysong #daolynhansinh #mindset","pinnedComment":"Theo bạn, khi nào im lặng là cách ứng xử khôn ngoan nhất? Chia sẻ suy nghĩ của bạn bên dưới nhé! 👇","affiliateSuggestions":"Dạy Bạn 800 Cách Đối Nhân Xử Thế","productLink":"https://shopee.vn/Sách-Dạy-Bạn-800-Cách-Đối-Nhân-Xử-Thế-i.1669447925.44079787773"}];
    var IMAGE_ITEMS = [];
    var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7caqA4OdsRgLzCr2QjB0708qVLQGvqLa2BUuIuWt0wG6QIBo_zqEyNEi_-XbUhcAUQg/exec";

    var currentTab = "video";
    var currentIndex = 0;
    var currentFilter = "pending"; // MẶC ĐỊNH LUÔN LÀ CHƯA ĐĂNG THEO YÊU CẦU
    var doneStorage = JSON.parse(localStorage.getItem("phuc_done_items") || "{}");

    function getItems() {
      return currentTab === "video" ? VIDEO_ITEMS : IMAGE_ITEMS;
    }

    function getItemKey(item) {
      return currentTab + "_" + (item ? item.stt : 0);
    }

    function isDone(item) {
      if (!item) return false;
      var k = getItemKey(item);
      if (doneStorage[k] !== undefined) return doneStorage[k];
      return String(item.status || "").toLowerCase().indexOf("đã đăng") !== -1;
    }

    function extractDriveId(url) {
      if (!url) return "";
      var s = String(url).trim();
      var m = s.match(/\/d\/([a-zA-Z0-9_-]{25,})/);
      if (m && m[1]) return m[1];
      var m2 = s.match(/id=([a-zA-Z0-9_-]{25,})/);
      if (m2 && m2[1]) return m2[1];
      if (/^[a-zA-Z0-9_-]{25,}$/.test(s)) return s;
      return "";
    }

    function switchTab(t) {
      currentTab = t;
      document.getElementById("tabVideoBtn").classList.toggle("active", t === "video");
      document.getElementById("tabImageBtn").classList.toggle("active", t === "image");

      // Cập nhật nhãn nút Hàng 4 phù hợp với Tab
      if (t === "video") {
        document.getElementById("lblRow4Col1").innerText = "▶️ Caption YouTube";
        document.getElementById("lblRow4Col2").innerText = "📄 Mô Tả YouTube";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Video";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Video Drive:";
      } else {
        document.getElementById("lblRow4Col1").innerText = "📸 Caption Insta";
        document.getElementById("lblRow4Col2").innerText = "🎨 Prompt AI";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Ảnh";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Ảnh Gốc:";
      }

      // Luôn đưa về bài chưa đăng đầu tiên của tab đó
      findAndSetFirstPendingIndex();
      loadCurrentItem();
      renderTable();
      updateStats();
    }

    function findAndSetFirstPendingIndex() {
      var items = getItems();
      for (var i = 0; i < items.length; i++) {
        if (!isDone(items[i])) {
          currentIndex = i;
          return;
        }
      }
      currentIndex = 0;
    }

    function loadCurrentItem() {
      var items = getItems();
      if (!items || items.length === 0) {
        document.getElementById("currStt").innerText = "#0";
        document.getElementById("currCategory").innerText = "Chưa có dữ liệu";
        document.getElementById("currTitle").innerText = "Chưa có bài viết nào trong tab này";
        document.getElementById("previewMediaBox").innerHTML = "<div class='preview-placeholder'><span class='icon'>📁</span><span>Không có dữ liệu</span></div>";
        return;
      }

      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= items.length) currentIndex = items.length - 1;

      var it = items[currentIndex];
      document.getElementById("currStt").innerText = "#" + it.stt;
      document.getElementById("currCategory").innerText = it.category || "Phúc Học Điều Hay";
      document.getElementById("currTitle").innerText = it.title;

      // Cập nhật Nút Đánh Dấu Đã Đăng (Hàng 5)
      var d = isDone(it);
      var btnMark = document.getElementById("btnMarkPosted");
      var lblMark = document.getElementById("lblMarkPosted");

      if (d) {
        btnMark.className = "btn-mark-posted state-done";
        lblMark.innerText = "✅ ĐÃ ĐĂNG (Hoàn tác)";
      } else {
        btnMark.className = "btn-mark-posted state-pending";
        lblMark.innerText = "🔴 ĐÁNH DẤU: ĐÃ ĐĂNG BÀI";
      }

      // TỰ ĐỘNG NẠP VÀO KHUNG XEM TRỰC TIẾP
      renderPreviewMedia(it);
    }

    function renderPreviewMedia(it) {
      var box = document.getElementById("previewMediaBox");
      box.innerHTML = "";

      if (currentTab === "video") {
        var vidUrl = it.videoUrl || it.zipUrl || "";
        var fileId = extractDriveId(vidUrl);

        if (fileId) {
          var previewSrc = "https://drive.google.com/file/d/" + fileId + "/preview";
          var iframe = document.createElement("iframe");
          iframe.src = previewSrc;
          iframe.allow = "autoplay; fullscreen";
          iframe.setAttribute("allowfullscreen", "true");
          box.appendChild(iframe);
        } else {
          box.innerHTML = "<div class='preview-placeholder'><span class='icon'>🎬</span><b>Chưa có link video Drive</b><span class='hint'>Hãy cập nhật cột 'Link Video Drive' trong sheet</span></div>";
        }
      } else {
        // TAB ẢNH - TUYỆT ĐỐI KHÔNG DÙNG AVATAR
        var imgUrl = it.imageUrl || ("Image/A (" + it.stt + ").jpg");
        var imgId = extractDriveId(imgUrl);
        var directImgSrc = imgId ? ("https://lh3.googleusercontent.com/d/" + imgId) : imgUrl;

        var img = document.createElement("img");
        img.src = directImgSrc;
        img.title = "Nhấp để phóng to toàn màn hình";
        img.onclick = function() { openLightbox(this.src); };
        img.onerror = function() {
          if (imgId && this.src.indexOf("googleusercontent") !== -1) {
            this.src = "https://drive.google.com/thumbnail?id=" + imgId + "&sz=w1000";
          } else {
            box.innerHTML = "<div class='preview-placeholder'><span class='icon'>📸</span><b>Không thể tải trước ảnh</b><span class='hint'>Bấm 'Tải Drive' để tải ảnh gốc</span></div>";
          }
        };
        box.appendChild(img);
      }
    }

    function triggerViewInFrame() {
      var it = getItems()[currentIndex];
      if (!it) return;
      renderPreviewMedia(it);
      showToast("👁️ Đang mở trình phát trong khung xem!");
    }

    function triggerDownloadDrive() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      var fileId = extractDriveId(rawUrl);

      if (fileId) {
        var dlUrl = "https://drive.google.com/uc?export=download&id=" + fileId;
        window.open(dlUrl, "_blank");
        showToast("📥 Đang tải file từ Google Drive...");
      } else if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có URL Google Drive cho bài này!");
      }
    }

    function openDriveExternalTab() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có đường link Google Drive!");
      }
    }

    function copyAffiliateLink() {
      if (currentTab !== "video") { showToast("⚠️ Link AFF chỉ áp dụng cho video"); return; }
      var it = getItems()[currentIndex];
      var url = it && it.productLink ? String(it.productLink).trim() : "";
      if (!/^https?:\/\//i.test(url)) { showToast("⚠️ Chưa có Link AFF cho video này"); return; }
      copyText(url, "Link AFF");
    }

    function copyAffiliateSuggestions() {
      if (currentTab !== "video") { showToast("⚠️ Gợi ý AFF chỉ áp dụng cho video"); return; }
      copyCurrentField("affiliateSuggestions", "Gợi Ý Sản Phẩm AFF");
    }

    function copyCurrentField(key, label) {
      var it = getItems()[currentIndex];
      if (!it) return;
      var txt = it[key] || "";
      if (!txt) {
        showToast("⚠️ Chưa có nội dung " + label);
        return;
      }
      copyText(txt, label);
    }

    function copyRow4Col1() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeTitle", "Tiêu Đề YouTube");
      } else {
        copyCurrentField("tiktok", "Caption Instagram");
      }
    }

    function copyRow4Col2() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeDesc", "Mô Tả YouTube");
      } else {
        copyCurrentField("prompt", "Prompt AI Tạo Ảnh");
      }
    }

    function nextItem() {
      var items = getItems();
      if (currentIndex < items.length - 1) {
        currentIndex++;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đã đến bài cuối cùng!");
      }
    }

    function prevItem() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đang ở bài đầu tiên!");
      }
    }

    function toggleCurrentDone() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var k = getItemKey(it);
      var currentDone = isDone(it);
      var newDone = !currentDone;

      doneStorage[k] = newDone;
      localStorage.setItem("phuc_done_items", JSON.stringify(doneStorage));

      // Đồng bộ 2 chiều về Google Sheet
      if (WEB_APP_URL && WEB_APP_URL.indexOf("http") === 0) {
        var syncUrl = WEB_APP_URL + "?action=markPosted&type=" + currentTab + "&stt=" + it.stt + "&title=" + encodeURIComponent(it.title) + "&isDone=" + newDone;
        fetch(syncUrl, { mode: "no-cors" }).catch(function(){});
      }

      if (newDone) {
        showToast("✅ Đã chuyển sang: ĐÃ ĐĂNG BÀI");
        // Khi ở bộ lọc "Chưa đăng", tự động chuyển sang bài chưa đăng tiếp theo
        if (currentFilter === "pending") {
          findAndSetFirstPendingIndex();
        }
      } else {
        showToast("⚪ Đã chuyển lại: CHƯA ĐĂNG");
      }

      loadCurrentItem();
      renderTable();
      updateStats();
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".filter-chip").forEach(function(c) { c.classList.remove("active"); });
      if (f === "pending") document.getElementById("chipPending").classList.add("active");
      else if (f === "done") document.getElementById("chipDone").classList.add("active");
      else document.getElementById("chipAll").classList.add("active");

      // Nếu bài hiện tại không thuộc bộ lọc mới, nhảy về bài đầu tiên thỏa mãn
      var items = getItems();
      var validIndex = -1;
      for (var i = 0; i < items.length; i++) {
        var d = isDone(items[i]);
        if (f === "all" || (f === "pending" && !d) || (f === "done" && d)) {
          validIndex = i;
          break;
        }
      }
      if (validIndex !== -1) {
        currentIndex = validIndex;
        loadCurrentItem();
      }

      renderTable();
    }

    function renderTable() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var items = getItems();
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      items.forEach(function(it, idx) {
        var d = isDone(it);
        if (currentFilter === "pending" && d) return;
        if (currentFilter === "done" && !d) return;

        var sttMatch = ("#" + it.stt).toLowerCase().indexOf(q) !== -1;
        var titleMatch = it.title.toLowerCase().indexOf(q) !== -1;
        if (q && !sttMatch && !titleMatch) return;

        var tr = document.createElement("tr");
        if (idx === currentIndex) tr.className = "active";
        tr.onclick = function() {
          currentIndex = idx;
          loadCurrentItem();
          renderTable();
          window.scrollTo({ top: 120, behavior: "smooth" });
        };

        tr.innerHTML = 
          '<td><b>#' + it.stt + '</b></td>' +
          '<td>' + it.title + '</td>' +
          '<td><span class="badge-status ' + (d ? "done" : "pending") + '">' + (d ? "Đã đăng" : "Chưa") + '</span></td>';
        tbody.appendChild(tr);
      });
    }

    function updateStats() {
      var items = getItems();
      var total = items.length;
      var doneCount = 0;
      var pendingCount = 0;

      items.forEach(function(it) {
        if (isDone(it)) doneCount++;
        else pendingCount++;
      });

      document.getElementById("vCount").innerText = VIDEO_ITEMS.length;
      document.getElementById("iCount").innerText = IMAGE_ITEMS.length;

      document.getElementById("countPending").innerText = pendingCount;
      document.getElementById("countDone").innerText = doneCount;
      document.getElementById("countAll").innerText = total;

      var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById("statText").innerText = "Đã đăng: " + doneCount + " / " + total;
      document.getElementById("statPercent").innerText = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function copyText(txt, label) {
      if (!txt) {
        showToast("⚠️ Nội dung trống");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() {
          showToast("✓ Đã sao chép: " + label);
        }).catch(function() {
          fallbackCopy(txt, label);
        });
      } else {
        fallbackCopy(txt, label);
      }
    }

    function fallbackCopy(txt, label) {
      var t = document.createElement("textarea");
      t.value = txt;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      showToast("✓ Đã sao chép: " + label);
    }

    function showToast(m) {
      var t = document.getElementById("toastMsg");
      t.innerText = m;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { t.style.display = "none"; }, 1800);
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    // KHỞI ĐỘNG MẶC ĐỊNH LÀ VIDEO & CHƯA ĐĂNG
    switchTab("video");
  </script>
</body>
</html>
